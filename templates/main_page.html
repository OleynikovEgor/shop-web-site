<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Название сайта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light custom-navbar">
    <div class="container-fluid">
        <a class="navbar-brand" href="http://127.0.0.1:5000/">Мой сайт</a>
        <div class="navbar-nav">
            <p class="custom-btn rounded-3 p-1">❤</p>
            <p class="custom-btn mx-3 rounded-3 p-1">🛒</p>

            {% if session.get("user_id") %}
                <a class="login_src" href="http://127.0.0.1:5000/profile">
                    <p class="custom-btn rounded-3 p-1">Личный кабинет</p>
                </a>
            {% else %}
                <a class="login_src" href="http://127.0.0.1:5000/login">
                    <p class="custom-btn rounded-3 p-1">Войти</p>
                </a>
            {% endif %}
        </div>
    </div>
</nav>
</body>
</html>
