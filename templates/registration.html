<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Название сайта</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="registration-container">
        <form class="registration-form" method="POST">
            <h2 class="text-center">Регистрация</h2>

            <div class="mb-2">
                <label for="first_name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="first_name" name="first_name"
                       value="{{ first_name if first_name }}" required>
            </div>
            <div class="mb-2">
                <label for="last_name" class="form-label">Фамилия</label>
                <input type="text" class="form-control" id="last_name" name="last_name"
                       value="{{ last_name if last_name }}" required>
            </div>

            <!-- Новый блок для выбора пола -->
            <div class="mb-2">
                <label class="form-label">Пол</label>
                <div>
                    <input type="radio" id="male" name="gender" value="male" required {% if gender== 'male' %}checked{%
                    endif %}>
                    <label for="male">Мужской</label>
                    <input type="radio" id="female" name="gender" value="female" required {% if gender== 'female'
                    %}checked{% endif %}>
                    <label for="female">Женский</label>
                </div>
            </div>

            <div class="mb-2">
                <label for="phone" class="form-label">Номер телефона</label>
                <input type="tel" class="form-control {% if phone_error %}is-invalid{% endif %}"
                       id="phone" name="phone" value="{{ phone if phone else '' }}" required>
                <div class="invalid-feedback">{{ phone_error }}</div>
            </div>
            <div class="mb-2">
                <label for="email" class="form-label">Почта</label>
                <input type="email" class="form-control {% if email_error %}is-invalid{% endif %}"
                       id="email" name="email" value="{{ email if email else '' }}" required>
                <div class="invalid-feedback">{{ email_error }}</div>
            </div>
            <div class="mb-2">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control {% if password_error %}is-invalid{% endif %}"
                       id="password" name="password" required>
            </div>
            <div class="mb-2">
                <label for="repassword" class="form-label">Повторите пароль</label>
                <input type="password" class="form-control {% if password_error %}is-invalid{% endif %}"
                       id="repassword" name="repassword" required>
                <div class="invalid-feedback">{{ password_error }}</div>
            </div>
            <div class="mb-2 form-check">
                <input type="checkbox" class="form-check-input" id="agreement" required>
                <label class="form-check-label" for="agreement">Я согласен с условиями</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
        </form>
    </div>
</div>
</body>
</html>
