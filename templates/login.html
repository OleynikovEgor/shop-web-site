<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Название сайта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login_page">
<form action="/login" method="POST">
    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email адрес</label>
        <input type="email" class="form-control {% if email_error %}is-invalid{% endif %}"
               id="exampleInputEmail1" aria-describedby="emailHelp"
               name="exampleInputEmail1" value="{{ email if not email_error else '' }}">
        <div id="emailHelp" class="form-text">Ваши данные останутся только у нас</div>
        {% if email_error %}
        <div class="invalid-feedback">{{ email_error }}</div>
        {% endif %}
    </div>

    <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Пароль</label>
        <input type="password" class="form-control {% if password_error %}is-invalid{% endif %}"
               id="exampleInputPassword1" name="exampleInputPassword1">
        {% if password_error %}
        <div class="invalid-feedback">Неверный пароль</div>
        {% endif %}
    </div>

    <div class="mb-3 registration">
        <p><a class="link-opacity-50-hover" href="{{ url_for('reg') }}">Ещё не зарегистрированы? Пора это исправить</a></p>
    </div>

    <button type="submit" class="btn btn-primary">Войти</button>
</form>
</body>
</html>
