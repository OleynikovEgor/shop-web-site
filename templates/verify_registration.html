<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Подтвердите регистрацию — Chrono Elegance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .auth-page {
      min-height: calc(100vh - 80px);
      display: flex; justify-content: center; align-items: center;
      padding: 2rem;
      background: url("{{ url_for('static', filename='img/login_bg.jpg') }}") center/cover no-repeat;
    }
    .auth-card {
      width: 100%; max-width: 360px;
      padding: 2rem; background: rgba(255,255,255,.9);
      border-radius: .75rem; box-shadow: 0 .25rem .75rem rgba(0,0,0,.15);
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light custom-navbar py-3">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('main_page') }}">
            <img src="{{ url_for('static', filename='img/crono_elegance.png') }}"
                 alt="Chrono Elegance" height="40">
        </a>

        <!-- Поиск -->
        <form class="d-flex mx-auto w-50" action="{{ url_for('main_page') }}" method="get">
            <input class="form-control me-2" type="search" name="q"
                   placeholder="Поиск часов" aria-label="Search"
                   value="{{ request.args.get('q','') }}">
            <button class="btn btn-outline-secondary" type="submit">
                <i class="bi bi-search"></i>
            </button>
        </form>

        <ul class="navbar-nav ms-auto align-items-center">
            {% if session.get('user_id') %}
            <!-- Лайк: всегда контур, подсчёт -->
            <li class="nav-item position-relative me-3">
                <a class="nav-link fs-4 text-dark" href="{{ url_for('favorites_view') }}">
                    <i class="bi bi-heart"></i>
                    {% if liked_count > 0 %}
                    <span class="heart-count-inside">{{ liked_count if liked_count<10 else '10+' }}</span>
                    {% endif %}
                </a>
            </li>

            <!-- КОРЗИНА: возвращена в шапку -->
            <li class="nav-item position-relative me-4">
                <a class="nav-link fs-4 text-dark" href="{{ url_for('cart_view') }}">
                    <i class="bi bi-cart"></i>
                    {% if cart_count > 0 %}
                    <span class="cart-count-inside">{{ cart_count if cart_count<10 else '10+' }}</span>
                    {% endif %}
                </a>
            </li>

            <!-- Личный кабинет -->
            <li class="nav-item">
                <a class="btn btn-dark text-white" href="{{ url_for('profile') }}">Личный кабинет</a>
            </li>
            {% else %}
            <!-- для гостей -->
            <li class="nav-item me-3">
                <a class="nav-link fs-4 text-dark" href="{{ url_for('login') }}">
                    <i class="bi bi-heart"></i>
                </a>
            </li>
            <li class="nav-item me-4">
                <a class="nav-link fs-4 text-dark" href="{{ url_for('login') }}">
                    <i class="bi bi-cart"></i>
                </a>
            </li>
            <li class="nav-item">
                <a class="btn btn-dark text-white" href="{{ url_for('login') }}">Войти</a>
            </li>
            {% endif %}
        </ul>
    </div>
</nav>

  <div class="auth-page">
    <div class="auth-card">
      <h4 class="text-center mb-4">Подтверждение регистрации</h4>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Введите код из письма, отправленного на вашу почту</label>
          <input type="text" name="code" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Подтвердить</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
