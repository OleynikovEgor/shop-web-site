<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Chrono Elegance{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light custom-navbar py-3">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('main_page') }}">
        <img src="{{ url_for('static', filename='img/crono_elegance.png') }}"
             alt="Chrono Elegance" height="40">
      </a>

      <form class="d-flex mx-auto w-50" action="{{ url_for('main_page') }}" method="get">
        <input class="form-control me-2" type="search" name="q"
               placeholder="Поиск часов" aria-label="Search"
               value="{{ request.args.get('q','') }}">
        <button class="btn btn-outline-secondary" type="submit">
          <i class="bi bi-search"></i>
        </button>
      </form>

      <ul class="navbar-nav ms-auto align-items-center">
        {% if session.get('user_id') %}
          <li class="nav-item me-3">
            <a class="nav-link fs-4 text-dark" href="{{ url_for('favorites') }}">
              <i class="bi bi-heart"></i>
            </a>
          </li>
          <li class="nav-item position-relative me-4">
            <a class="nav-link fs-4 text-dark" href="{{ url_for('cart_view') }}">
              <i class="bi bi-cart"></i>
              {% if cart_count and cart_count > 0 %}
                <span class="badge bg-danger position-absolute top-0 start-100 translate-middle">
                  {{ cart_count }}
                </span>
              {% endif %}
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-dark text-white" href="{{ url_for('profile') }}">
              Личный кабинет
            </a>
          </li>
        {% else %}
          <li class="nav-item me-3">
            <a class="nav-link fs-4 text-dark" href="{{ url_for('login') }}">
              <i class="bi bi-heart"></i>
            </a>
          </li>
          <li class="nav-item me-4">
            <a class="nav-link fs-4 text-dark" href="{{ url_for('login') }}">
              <i class="bi bi-cart"></i>
            </a>
          </li>
          <li class="nav-item">
            <a class="btn btn-dark text-white" href="{{ url_for('login') }}">
              Войти
            </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </nav>

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
